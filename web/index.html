<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox Reborn</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="toolbar">
  <button id="menuBtn" class="iconbtn" aria-label="Menu">
    <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </button>
  <span class="title">Inbox</span>
  <button id="pinFilter" class="iconbtn dim" aria-label="Pinned only" title="Pinned only">
    <svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
  </button>
  <button id="searchBtn" class="iconbtn" aria-label="Search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
  </button>
</header>
<div id="searchBar" class="searchbar" hidden>
  <input id="searchInput" type="search" placeholder="Search mail, bundles, reminders…" aria-label="Search">
</div>
<nav id="drawer" class="drawer" hidden>
  <button data-tab="inbox" class="active">Inbox <span id="cInbox"></span></button>
  <button data-tab="snoozed">Snoozed <span id="cSnoozed"></span></button>
  <button data-tab="done">Done <span id="cDone"></span></button>
  <button data-tab="reminders">Reminders <span id="cRem"></span></button>
</nav>

<main id="stream" class="stream"></main>

<div id="fabWrap">
  <div id="fabMenu" class="fabmenu" hidden>
    <button id="addReminder">Reminder</button>
    <button id="addMail">Compose mail</button>
  </div>
  <button id="fab" class="fab" aria-label="Compose">+</button>
</div>

<div id="sheet" class="sheet" hidden>
  <h2 id="sheetTitle">Snooze until…</h2>
  <div id="sheetGrid" class="grid"></div>
  <div id="sheetCustom" hidden>
    <input id="customDate" type="datetime-local">
    <button id="customGo">Snooze</button>
  </div>
  <button id="sheetCancel" class="cancel">Cancel</button>
</div>

<div id="remDialog" class="sheet" hidden>
  <h2>New reminder</h2>
  <input id="remTitle" placeholder="Remind me to…" aria-label="Reminder title">
  <div id="remGrid" class="grid"></div>
  <button id="remCancel" class="cancel">Cancel</button>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
